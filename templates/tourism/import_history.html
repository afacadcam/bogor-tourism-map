{% extends "base/base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Riwayat Import Data</h2>
    <ul>
        {% for item in imports %}
        <li>{{ item.file.name }} - {{ item.created_at }}</li>
        {% empty %}
        <li>Tidak ada riwayat import.</li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
